name: Build and Push Multi-arch Artifacts

on:
  push:
    branches: ['main', 'master', 'release-*', 'feature-terraform-provider-submodule']
    tags: ['v*']

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64]
    permissions:
      contents: read
      packages: write

    env:
      PROJECT_NAME: provider-proxmox-crossplane
      REGISTRY: ghcr.io/${{ github.repository }}
      VERSION: v0.1.0
      TARGETOS: linux
      TARGETARCH: ${{ matrix.arch }}
      PACKAGE_ROOT: package

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Install Crossplane CLI
        run: |
          curl -sL https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh | sh
          sudo mv crossplane /usr/local/bin/
          chmod +x /usr/local/bin/crossplane

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Package Structure
        run: |
          make package.prepare
          ls -la package/
          ls -la package/crds/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        run: |
          make image.build
          make image.publish
          make package
          echo "Checking package location:"
          ls -la package/_output/
          make package.push

      - name: Save Artifacts for Air-gapped Environment
        run: |
          mkdir -p provider-artifacts
          cp package/_output/${PROJECT_NAME}-${TARGETARCH}.xpkg provider-artifacts/
          tar czf provider-artifacts.tar.gz provider-artifacts/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: provider-artifacts
          path: provider-artifacts.tar.gz
          retention-days: 5