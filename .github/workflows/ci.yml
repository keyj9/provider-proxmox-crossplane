name: Build and Push Multi-arch Artifacts

on:
  push:
    branches: ['main', 'master', 'release-*', 'feature-terraform-provider-submodule']
    tags: ['v*']

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64]
    permissions:
      contents: read
      packages: write

    env:
      PROJECT_NAME: provider-proxmox-crossplane
      REGISTRY: ghcr.io/${{ github.repository }}
      VERSION: v1.0.0
      TARGETOS: linux
      TARGETARCH: ${{ matrix.arch }}
      PACKAGE_ROOT: package

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Install Crossplane CLI
        run: |
          curl -sL https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh | sh
          sudo mv crossplane /usr/local/bin/
          chmod +x /usr/local/bin/crossplane

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Kubeconfig
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p $HOME/.kube
          echo "$KUBECONFIG_DATA" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Verify Kubernetes Connectivity
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Prepare Package Structure
        run: |
          make package.prepare
          echo "Contents of package/:"
          ls -la package/
          echo "Contents of package/crds/:"
          ls -la package/crds/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        run: |
          make image.build
          make image.publish
          make package
          echo "Package contents:"
          ls -la package/_output/
          echo "Image details:"
          docker images | grep $PROJECT_NAME
          make package.push

      - name: Save Artifacts for Air-gapped Environment
        run: |
          # Execute the make target to save both .xpkg and .tar artifacts
          make save-artifacts

          # Verify the contents of the air-gapped directory
          echo "Contents of _output/air-gapped/:"
          ls -la _output/air-gapped/

          # Archive the artifacts for uploading
          cd _output && tar czf ../provider-artifacts.tar.gz air-gapped/
        shell: /usr/bin/bash -e {0}
        env:
          PROJECT_NAME: provider-proxmox-crossplane
          REGISTRY: ghcr.io/keyj9/provider-proxmox-crossplane
          VERSION: v1.0.0
          TARGETOS: linux
          TARGETARCH: amd64
          PACKAGE_ROOT: package

      - name: Upload Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: provider-artifacts
          path: provider-artifacts.tar.gz
          retention-days: 5

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f cluster/deployment.yaml

      - name: Wait for Deployment
        run: |
          kubectl rollout status deployment/provider-proxmox -n crossplane-system

      - name: Fetch Logs on Failure
        if: failure()
        run: |
          kubectl logs deployment/provider-proxmox -n crossplane-system > provider-proxmox.log
          mkdir -p _output/logs
          mv provider-proxmox.log _output/logs/

      - name: Run kubectl logs
        run: |
          kubectl logs deployment/provider-proxmox -n crossplane-system > provider-proxmox.log