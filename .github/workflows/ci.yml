name: Build and Publish

on:
  push:
    branches:
      - ['main', 'master', 'release-*', 'feature-terraform-provider-submodule']

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up environment variables
        run: |
          echo "PROJECT_NAME=provider-proxmox-crossplane" >> $GITHUB_ENV
          echo "REGISTRY=ghcr.io/keyj9" >> $GITHUB_ENV
          echo "CONTROLLER_IMAGE=$REGISTRY/$PROJECT_NAME-controller-${{ matrix.arch }}" >> $GITHUB_ENV
          echo "PACKAGE_IMAGE=$REGISTRY/$PROJECT_NAME-package-${{ matrix.arch }}" >> $GITHUB_ENV
          echo "VERSION=v1.0.0" >> $GITHUB_ENV
          echo "TARGETOS=linux" >> $GITHUB_ENV
          echo "TARGETARCH=${{ matrix.arch }}" >> $GITHUB_ENV
          echo "PACKAGE_ROOT=package" >> $GITHUB_ENV

      - name: Build and Push Controller Image
        run: |
          make image.build
          make image.publish

      - name: Build and Push Package
        run: |
          make package
          make package.publish

      - name: Save Artifacts for Air-gapped Environment
        shell: bash
        run: |
          # Create the directory if it doesn't exist
          mkdir -p _output/air-gapped
          # Save controller image
          docker save ${CONTROLLER_IMAGE}:${VERSION} > _output/air-gapped/controller-image-${TARGETARCH}.tar || { echo "Failed to save controller image"; exit 1; }
          # Save package image
          docker save ${PACKAGE_IMAGE}:${VERSION} > _output/air-gapped/package-image-${TARGETARCH}.tar || { echo "Failed to save package image"; exit 1; }
          # Tar each image separately
          cd _output/air-gapped
          tar czf ../../controller-artifacts.tar.gz controller-image-${TARGETARCH}.tar
          tar czf ../../package-artifacts.tar.gz package-image-${TARGETARCH}.tar
