name: Build and Push Multi-arch Artifacts

on:
  push:
    branches: ['main', 'master', 'release-*', 'feature-terraform-provider-submodule']
    tags: ['v*']

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64]
    permissions:
      contents: read
      packages: write

    env:
      PROJECT_NAME: provider-proxmox-crossplane
      REGISTRY: ghcr.io/${{ github.repository }}
      VERSION: ${{ github.ref_name }}
      TARGETOS: linux
      TARGETARCH: ${{ matrix.arch }}
      PACKAGE_ROOT: package

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Install Crossplane CLI
        run: |
          curl -sL https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh | sh
          sudo mv crossplane /usr/local/bin/
          chmod +x /usr/local/bin/crossplane

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Package Structure
        run: make package.prepare

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        run: |
          make image.build
          make image.publish
          make package
          make package.push

      - name: Validate Air-gapped Setup
        run: make validate-airgapped

      - name: Save Artifacts for Air-gapped Environment
        run: |
          mkdir -p _output/air-gapped
          docker save $(REGISTRY)/$(PROJECT_NAME)-$(TARGETARCH):$(VERSION) > _output/air-gapped/provider-image.tar
          cp package/_output/$(PROJECT_NAME)-$(TARGETARCH).xpkg _output/air-gapped/
          tar czf provider-artifacts.tar.gz _output/air-gapped/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: provider-artifacts
          path: provider-artifacts.tar.gz
          retention-days: 5

      - name: Validate Air-gapped Requirements
        run: |
          docker inspect $(REGISTRY)/$(PROJECT_NAME)-$(TARGETARCH):$(VERSION) \
            --format '{{ range .Config.Env }}{{ println . }}{{ end }}' | \
            grep -q TERRAFORM_PROVIDER_PATH